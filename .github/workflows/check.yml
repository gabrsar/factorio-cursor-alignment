name: Package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/build.py check
      - run: python -m unittest discover -s tests -p test_build.py -v
      - run: python tools/build.py build
      - uses: actions/upload-artifact@v4
        with:
          name: cursor-alignment-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.sha256
