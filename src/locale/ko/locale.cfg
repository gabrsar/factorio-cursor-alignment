[mod-name]
cursor-alignment=커서 정렬 가이드

[mod-description]
cursor-alignment=커서 정렬 가이드 — 전환: __CONTROL__cursor-alignment-toggle__. 강조: __CONTROL__cursor-alignment-hover__. 설정: __CONTROL__cursor-alignment-config__.

[controls]
cursor-alignment-toggle=가이드 전환
cursor-alignment-hover=커서 아래 개체 강조
cursor-alignment-config=정렬 설정 열기

[mod-setting-name]
cursor-alignment-enabled=가이드 활성화
cursor-alignment-always=항상 표시
cursor-alignment-color=가이드 색상
cursor-alignment-length=범위 (타일)
cursor-alignment-fill=채우기 강도 (%)
cursor-alignment-mode=표시 조건
cursor-alignment-mix=가산 혼합 (%)
cursor-alignment-grid-only=격자에 맞는 가이드만

[mod-setting-description]
cursor-alignment-mix=0%: 일반 투명 합성. 100%: 배경 밝기를 유지하는 가산 합성.
cursor-alignment-grid-only=모드 API는 Shift를 누르고 있는 상태와 복사/선택 도구의 연속 격자 맞춤을 지원하지 않습니다. 격자 전용 모드는 자유 이동 띠를 숨깁니다.

[string-mod-setting]
cursor-alignment-mode-auto=건설 / 선택 시
cursor-alignment-mode-manual=수동 전환
cursor-alignment-mode-always=항상 표시

