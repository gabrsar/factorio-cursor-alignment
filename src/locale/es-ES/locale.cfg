cursor-alignment-grid-only=Solo guías ajustadas

[mod-setting-description]
cursor-alignment-mix=0%: transparencia normal. 100%: color aditivo, conservando el brillo del fondo.
cursor-alignment-grid-only=La API no detecta Shift mantenido ni permite ajustar continuamente las herramientas de copia/selección. La opción de ajuste oculta las franjas libres.

