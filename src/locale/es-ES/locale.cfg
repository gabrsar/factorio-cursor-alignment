cursor-alignment=Guías de alineación — Alternar: __CONTROL__cursor-alignment-toggle__. Resaltar: __CONTROL__cursor-alignment-hover__. Panel: __CONTROL__cursor-alignment-config__.

[controls]
cursor-alignment-toggle=Alternar guías
cursor-alignment-hover=Resaltar entidad bajo el cursor
cursor-alignment-config=Abrir ajustes de alineación

