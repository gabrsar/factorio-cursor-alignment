[mod-name]
cursor-alignment=光标对齐辅助

[mod-description]
cursor-alignment=光标对齐辅助 — 切换：__CONTROL__cursor-alignment-toggle__。高亮：__CONTROL__cursor-alignment-hover__。面板：__CONTROL__cursor-alignment-config__。

[controls]
cursor-alignment-toggle=切换辅助线
cursor-alignment-hover=高亮光标下的实体
cursor-alignment-config=打开对齐设置

[mod-setting-name]
cursor-alignment-enabled=启用辅助线
cursor-alignment-always=始终显示
cursor-alignment-color=辅助线颜色
cursor-alignment-length=范围（格）
cursor-alignment-fill=填充强度 (%)
cursor-alignment-mode=显示方式
cursor-alignment-mix=叠加混合 (%)
cursor-alignment-grid-only=仅显示对齐网格的辅助线

[mod-setting-description]
cursor-alignment-mix=0%：普通透明混合。100%：颜色叠加，保留背景亮度。
cursor-alignment-grid-only=模组 API 无法检测持续按住 Shift，也无法让复制或选择工具连续吸附网格。仅网格模式会隐藏未对齐的色带。

[string-mod-setting]
cursor-alignment-mode-auto=建造或选择时
cursor-alignment-mode-manual=手动切换
cursor-alignment-mode-always=始终显示

[cursor-alignment]
on=辅助线已开启。
off=辅助线已关闭。
enable-in-settings=启用辅助线 — 打开对齐设置

