keys=切换：__CONTROL__cursor-alignment-toggle__。高亮：__CONTROL__cursor-alignment-hover__。面板：__CONTROL__cursor-alignment-config__。

anchor-help=__CONTROL__cursor-alignment-hover__ 在光标所在格子添加或移除参考线。可保留多个参考线，切换工具或表面不会删除；在各自格子再次按下即可移除。
