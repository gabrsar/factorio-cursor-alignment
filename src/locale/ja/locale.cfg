[mod-name]
cursor-alignment=カーソル整列ガイド

[mod-description]
cursor-alignment=カーソル整列ガイド — 切り替え：__CONTROL__cursor-alignment-toggle__。強調：__CONTROL__cursor-alignment-hover__。設定：__CONTROL__cursor-alignment-config__。

[controls]
cursor-alignment-toggle=ガイドを切り替え
cursor-alignment-hover=整列ツールを有効にする
cursor-alignment-config=ガイド設定を開く

[mod-setting-name]
cursor-alignment-enabled=ガイドを有効化
cursor-alignment-always=常に表示
cursor-alignment-color=ガイドの色
cursor-alignment-length=範囲（タイル）
cursor-alignment-fill=塗りの強さ (%)
cursor-alignment-mode=表示条件
cursor-alignment-mix=加算合成 (%)
cursor-alignment-grid-only=グリッドに合うガイドのみ

[mod-setting-description]
cursor-alignment-mix=0%：通常の透明合成。100%：背景の明るさを保つ加算合成。
cursor-alignment-grid-only=APIではShiftの長押しやコピー・選択ツールの連続グリッド吸着を検出できません。グリッド限定では自由移動する帯を非表示にします。

[string-mod-setting]
cursor-alignment-mode-auto=建設・選択時
cursor-alignment-mode-manual=手動切り替え
cursor-alignment-mode-always=常に表示

[cursor-alignment]
on=ガイドを有効にしました。
off=ガイドを無効にしました。
enable-in-settings=ガイドを有効化 — ガイド設定を開く

