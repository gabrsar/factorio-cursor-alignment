[mod-setting-description]
cursor-alignment-mix=0%: normal transparency. 100%: additive color; the background stays brighter.
cursor-alignment-grid-only=Holding Shift and continuous tile snapping for copy/selection tools are unavailable in the mod API. Grid-only hides unsnapped bands.

