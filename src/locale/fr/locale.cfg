[mod-setting-description]
cursor-alignment-mix=0% : transparence normale. 100% : couleur additive, préservant la luminosité du fond.
cursor-alignment-grid-only=L’API ne détecte pas Maj maintenue ni l’alignement continu des outils de copie/sélection. L’option d’alignement masque les bandes libres.

