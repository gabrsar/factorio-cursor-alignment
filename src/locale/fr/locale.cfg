cursor-alignment=Guides d’alignement — Basculer : __CONTROL__cursor-alignment-toggle__. Survol : __CONTROL__cursor-alignment-hover__. Panneau : __CONTROL__cursor-alignment-config__.

[controls]
cursor-alignment-toggle=Activer/désactiver les guides
cursor-alignment-hover=Surligner l’entité sous le curseur
cursor-alignment-config=Ouvrir les réglages des guides

